<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Step-by-step planting, watering, and harvest care for MausamCrop vegetables." />
    <title>Cultivation Guide — MausamCrop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="page" data-page="guide">
    <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

    <header class="site-header">
      <div class="container nav-bar">
        <a class="brand" href="index.html" aria-label="MausamCrop home">
          <img 
          src="assets/images/logo-removebg-preview.png" 
          alt="MausamCrop Emblem" 
          class="brand-mark brand-mark"
          />
          <span class="brand-name">
            <span class="word-mausam">Mausam</span><span class="word-crop">Crop</span>
          </span>
        </a>
        <nav class="nav-links" id="primary-nav" aria-label="Primary">
          <a href="index.html" data-i18n="navHome">Home</a>
          <a href="location.html" data-i18n="navFind">Find Crops</a>
          <a href="guide.html" aria-current="page" data-i18n="navGuide">Cultivation Guide</a>
        </nav>
        <div class="nav-tools">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" data-lang="hi" aria-pressed="false">HI</button>
          </div>
          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
            <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true">
              <path d="M1 1h16M1 7h16M1 13h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="page-main">
      <section class="section" aria-labelledby="guide-title">
        <div class="container">
          <p class="eyebrow" data-i18n="guideEyebrow">Care timeline</p>
          <h1 id="guide-title" class="section-title" data-i18n="guideTitle">Cultivation guide</h1>
          <p class="section-lead" data-i18n="guideLead">
            Choose a crop, then move through soil prep, sowing, watering, and harvest.
          </p>

          <div class="field mt-4" style="max-width: 320px">
            <label for="crop-select" data-i18n="cropSelect">Crop</label>
            <select id="crop-select" name="crop"></select>
          </div>

          <div class="card-meta mt-4" id="guide-meta"></div>

          <div class="guide-tabs" role="tablist" aria-label="Guide stages" id="guide-tabs">
            <button type="button" role="tab" aria-selected="true" data-stage="soil" data-i18n="stageSoil">Soil Prep</button>
            <button type="button" role="tab" aria-selected="false" data-stage="sow" data-i18n="stageSow">Sowing</button>
            <button type="button" role="tab" aria-selected="false" data-stage="water" data-i18n="stageWater">Watering Schedule</button>
            <button type="button" role="tab" aria-selected="false" data-stage="harvest" data-i18n="stageHarvest">Harvesting</button>
          </div>

          <div class="timeline" id="guide-timeline"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p><strong>MausamCrop</strong> · <span data-i18n="footerTag">College Phase 1 prototype</span></p>
        <p data-i18n="footerNote">Mock weather only — not a substitute for local agronomy advice.</p>
      </div>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
